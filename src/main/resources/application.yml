spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:1108/minjulog_feed?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${SPRING_DATASOURCE_USERNAME:minju}
    password: ${SPRING_DATASOURCE_PASSWORD:minjupw}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    properties:
      hibernate:
        format_sql: ${HIBERNATE_FORMAT_SQL:true}
        show_sql: ${HIBERNATE_SHOW_SQL:false}
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false

stomp:
  relay:
    host: ${STOMP_RELAY_HOST:localhost}
    port: ${STOMP_RELAY_PORT:61613}
    client-login: ${STOMP_RELAY_CLIENT_LOGIN:guest}
    client-passcode: ${STOMP_RELAY_CLIENT_PASSCODE:guest}
    system-login: ${STOMP_RELAY_SYSTEM_LOGIN:guest}
    system-passcode: ${STOMP_RELAY_SYSTEM_PASSCODE:guest}

env:
  deploy-color: ${DEPLOY_COLOR:unknown}
  minio:
    end-point: ${MINIO_ENDPOINT:http://localhost:1110}
    access-key: ${MINIO_ACCESS_KEY:minjulog}
    secret-key: ${MINIO_SECRET_KEY:minjulog}
    bucket-name: ${MINIO_BUCKET_NAME:minjulog}
    external-base: ${MINIO_EXTERNAL_BASE:http://localhost:1107/minjulog-static}
  livekit:
    api-key: ${LIVEKIT_API_KEY:devkey}
    api-secret: ${LIVEKIT_API_SECRET:devsecretdevsecretdevsecretdevsecret}
    hybrid:
      mode: ${LIVEKIT_HYBRID_MODE:auto}
      switch-to-sfu-at: ${LIVEKIT_HYBRID_SWITCH_TO_SFU_AT:3}
      switch-to-mesh-at: ${LIVEKIT_HYBRID_SWITCH_TO_MESH_AT:2}
  voice:
    workspace-id: ${VOICE_WORKSPACE_ID:1}
  reaction:
    workspace-id: ${REACTION_WORKSPACE_ID:1}

logging:
  level:
    org.hibernate.SQL: ${LOG_HIBERNATE_SQL:debug}
    org.hibernate.orm.jdbc.bind: ${LOG_HIBERNATE_BIND:trace}
    org.springframework.web.socket: ${LOG_WS:DEBUG}
    org.springframework.messaging: ${LOG_MESSAGING:DEBUG}
    org.springframework.messaging.simp.stomp: ${LOG_STOMP:DEBUG}

management:
  endpoints:
    web:
      exposure:
        include: prometheus

  metrics:
    distribution:
      percentiles-histogram:
        all: true
